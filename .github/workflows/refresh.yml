name: Refresh AI Visibility Reports

# The live reports, <slug>/index.html for every config in configs/ (paused ones are
# skipped and keep their page). Built by labs/tools/build_labs.py --live, the same
# builder and template as the labs preview (labs.yml).
on:
  schedule:
    - cron: '0 8 * * 1,4'   # Monday + Thursday, 8am UTC
  workflow_dispatch:         # manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r labs/tools/requirements.txt

      - name: Test the builder
        run: python -m pytest labs/tools -q -p no:cacheprovider

      - name: Build all clients
        env:
          AIV_API_KEY:     ${{ secrets.AIPEEKABOO_API_KEY }}
          AIV_API_KEY_ECI: ${{ secrets.AIPEEKABOO_API_KEY_ECI }}
          AIV_API_KEY_LM:  ${{ secrets.AIPEEKABOO_API_KEY_LM }}
        run: python labs/tools/build_labs.py --live --all

      # Runs even when the build step failed, so reports that DID build still ship
      # while the run itself stays red for the ones that didn't. Commits only the
      # report pages, on top of the branch's latest commit (a labs run may have pushed
      # meanwhile), and retries if the push is rejected.
      - name: Commit and push successful reports
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=$(for c in configs/*.json; do s=$(basename "$c" .json); [ -f "$s/index.html" ] && echo "$s/index.html"; done)
          if [ -z "$files" ]; then echo "Nothing built"; exit 0; fi
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$branch"
            git reset --quiet --mixed "origin/$branch"
            git add -- $files
            if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
            git commit --quiet -m "auto-refresh: $(date +%Y-%m-%d)"
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "Push rejected (attempt $attempt), retrying"
            sleep 5
          done
          exit 1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Report refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Scheduled refresh failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['build-failure']
            })
