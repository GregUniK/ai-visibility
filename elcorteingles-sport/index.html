<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>El Corte Inglés (Sport) — AI Visibility</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .wrap{text-align:center;max-width:400px}
  img{width:48px;height:48px;border-radius:10px;margin-bottom:20px}
  h1{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:8px}
  p{font-size:.88rem;color:#64748b;line-height:1.6}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b82f6;margin:24px 4px 0;animation:pulse 1.4s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <img src="https://www.google.com/s2/favicons?domain=elcorteingles.pt&sz=64" alt="">
  <h1>El Corte Inglés (Sport)</h1>
  <p>AI visibility data is being collected.<br>Report will be available shortly.</p>
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</body>
</html>
